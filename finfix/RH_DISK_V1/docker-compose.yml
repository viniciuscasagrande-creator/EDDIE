services:
  postgres:
    image: postgres:16-alpine
    container_name: rh_disk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rh_disk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - rh_disk_pg_data:/var/lib/postgresql/data

volumes:
  rh_disk_pg_data:
